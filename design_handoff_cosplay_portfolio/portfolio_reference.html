function applyScheme(name) {
  const sc = SCHEMES[name] || SCHEMES.pink;
  const r = document.documentElement;
  r.style.setProperty('--brand',             sc.brand);
  r.style.setProperty('--brand-hover',       sc.hover);
  r.style.setProperty('--brand-strong',      sc.strong);
  r.style.setProperty('--brand-soft',        sc.soft);
  r.style.setProperty('--border-brand',      sc.soft.replace('rgba(', 'rgba(').replace('.15)', '.50)'));
  r.style.setProperty('--text-link',         sc.brand);
  r.style.setProperty('--shadow-pink-glow',  '0 0 20px ' + sc.glow);
  r.style.setProperty('--shadow-pink-soft',  '0 4px 14px ' + sc.soft);
  r.style.setProperty('--shadow-pink-hover', '0 20px 25px -5px ' + sc.glow + ', 0 8px 10px -6px ' + sc.glow);
  r.style.setProperty('--pink-400',          sc.grad1);
  r.style.setProperty('--rose-400',          sc.grad2);
  r.style.setProperty('--pink-500',          sc.brand);
}

/* ── COLOR EXTRACTION (auto-theme hero from image) ─────────────────────── */
function getSaturation(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  return d===0?0:d/(1-Math.abs(max+min-1));
}
function extractDominantColor(src, cb) {
  const img = new Image();
  img.onload = () => {
    const sz = 80;
    const cv = document.createElement('canvas');
    cv.width = sz; cv.height = sz;
    const cx = cv.getContext('2d');
    cx.drawImage(img, 0, 0, sz, sz);
    const d = cx.getImageData(0,0,sz,sz).data;
    let r=0,g=0,b=0,tw=0;
    for(let i=0;i<d.length;i+=4){
      const a=d[i+3],br=(d[i]+d[i+1]+d[i+2])/3;
      const sat=getSaturation(d[i],d[i+1],d[i+2]);
      if(a>100&&br>20&&br<235){
        const w=0.1+sat*6;
        r+=d[i]*w;g+=d[i+1]*w;b+=d[i+2]*w;tw+=w;
      }
    }
    cb(tw>0?[Math.round(r/tw),Math.round(g/tw),Math.round(b/tw)]:[100,60,180]);
  };
  img.onerror=()=>cb([100,60,180]);
  img.src=src;
}
function colorToTheme([r,g,b]){
  const boost=v=>Math.min(255,Math.round(v*1.4));
  const br=boost(r), bg_=boost(g), bb=boost(b);
  return {
    accent:    `rgb(${br},${bg_},${bb})`,
    darkBase:  `rgb(${Math.round(r*.10)},${Math.round(g*.10)},${Math.round(b*.14)})`,
    lightBase: `rgb(${Math.min(255,Math.round(r*.18+205))},${Math.min(255,Math.round(g*.18+205))},${Math.min(255,Math.round(b*.18+205))})`,
    glow:      `rgba(${r},${g},${b},.55)`,
  };
}

/* ── HERO BANNER ─────────────────────────────────────────────────────────── */
function HeroBanner({ data, theme, lang }) {
  const imgs = data.heroImages;
  const [idx, setIdx] = useState(0);
  const [prev, setPrev] = useState(null);
  const [themes, setThemes] = useState({});
  const [aspects, setAspects] = useState({});
  const isCutout = (src, i) => {
    if (data.heroCutouts && i !== undefined) return !!data.heroCutouts[i];
    return src && (src.endsWith('.png') || src.endsWith('.webp'));
  };

  useEffect(() => {
    imgs.forEach((src, i) => {
      extractDominantColor(src, (rgb) => {
        setThemes(prev => ({...prev, [i]: colorToTheme(rgb)}));
      });
      const probe = new Image();
      probe.onload = () => setAspects(prev => ({...prev, [i]: probe.naturalWidth / probe.naturalHeight}));
      probe.src = src;
    });
  }, [imgs]);

  const isLandscape = (aspects[idx] || 1) > 1.2;

  const colorTheme = themes[idx] || data.heroThemes?.[idx] || { c1:"#12042a", c2:"#3b1278", c3:"#0d0918", glow:"rgba(139,92,246,.55)" };
  const isDark = theme !== "light";
  const extractedTheme = themes[idx];
  const accent    = extractedTheme?.accent    || data.heroThemes?.[idx]?.c2   || "#3b1278";
  const glowColor = extractedTheme?.glow      || data.heroThemes?.[idx]?.glow || "rgba(139,92,246,.5)";
  const darkBase  = extractedTheme?.darkBase  || "#08050f";
  const lightBase = extractedTheme?.lightBase || "#ede8f8";
  const baseBg = isDark ? "#080810" : "#ffffff";

  const timerRef = useRef(null);

  const advance = useCallback((dir) => {
    const next = (idx + dir + imgs.length) % imgs.length;
    setPrev(idx); setIdx(next);
    setTimeout(() => setPrev(null), 750);
  }, [idx, imgs.length]);

  useEffect(() => {
    timerRef.current = setInterval(() => advance(1), 4000);
    return () => clearInterval(timerRef.current);

    title:{ margin:0, fontSize:48, fontWeight:800, letterSpacing:-.02, background:"linear-gradient(90deg,var(--pink-400),var(--rose-400))", WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" },
    desc: { color:"var(--slate-300)", fontSize:"var(--text-base)", lineHeight:1.6, marginTop:10, marginBottom:24 },
    btn:  { display:"inline-flex", alignItems:"center", gap:6, padding:"10px 22px", borderRadius:"var(--radius-sm)", background:"var(--brand)", color:"#fff", fontWeight:500, fontSize:"var(--text-sm)", border:"none", cursor:"pointer", boxShadow:"var(--shadow-pink-soft)" },
    arrowL:{ position:"absolute", left:16, top:"50%", zIndex:5, transform:"translateY(-50%)", width:40, height:40, borderRadius:"var(--radius-full)", background:"rgba(236,72,153,.25)", border:"1px solid rgba(236,72,153,.4)", backdropFilter:"blur(8px)", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", cursor:"pointer", border:"none" },

      </div>

  );
}

/* ── LIGHTBOX ────────────────────────────────────────────────────────────── */
function Lightbox({ photos, startIdx, onClose }) {
  const [idx, setIdx] = useState(startIdx||0);
  const total = photos.length;
  const prev = () => setIdx(i => (i-1+total)%total);
  const next = () => setIdx(i => (i+1)%total);
  useEffect(() => {
    const h = e => {
      if(e.key==="Escape") onClose();
      if(e.key==="ArrowLeft") prev();
      if(e.key==="ArrowRight") next();
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [total]);
  const navBtn = (onClick, d, right) => (
    <button onClick={e=>{e.stopPropagation();onClick();}} style={{position:"absolute",top:"50%",transform:"translateY(-50%)",[right?"right":"left"]:16,width:44,height:44,borderRadius:"var(--radius-full)",background:"rgba(0,0,0,.6)",border:"1px solid rgba(255,255,255,.2)",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",zIndex:55,backdropFilter:"blur(4px)"}}>{d}</button>
  );
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:50,background:"rgba(0,0,0,.92)",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <img key={idx} src={photos[idx]} alt="" onClick={e=>e.stopPropagation()} style={{maxHeight:"88vh",maxWidth:"88vw",objectFit:"contain",borderRadius:"var(--radius-md)",boxShadow:"var(--shadow-pink-glow)",animation:"hero-fade-in .25s ease"}} />
      {total>1 && navBtn(prev,<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg>,false)}
      {total>1 && navBtn(next,<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>,true)}
      {total>1 && <div style={{position:"absolute",bottom:24,left:"50%",transform:"translateX(-50%)",display:"flex",gap:6}}>{photos.map((_,i)=><div key={i} onClick={e=>{e.stopPropagation();setIdx(i);}} style={{width:i===idx?20:6,height:6,borderRadius:3,background:i===idx?"var(--brand)":"rgba(255,255,255,.35)",cursor:"pointer",transition:"all .2s"}}></div>)}</div>}
      <button onClick={onClose} style={{position:"absolute",top:16,right:16,width:36,height:36,borderRadius:"var(--radius-full)",background:"var(--brand)",border:"none",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",zIndex:55}}>
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  );
}

/* ── ADMIN LOGIN ─────────────────────────────────────────────────────────── */
function AdminLogin({ onExit, scheme, onSchemeChange }) {
  const [u,setU]=useState("admin"); const [p,setP]=useState("admin"); const [err,setErr]=useState("");
  const [ok,setOk]=useState(false);
  const [heroSlots, setHeroSlots] = useState(
    DATA.heroImages.map((src,i) => ({ src, color: DATA.heroThemes?.[i]?.c2 || null, mode:"auto", cutout: DATA.heroCutouts?.[i] ?? true }))
  );
  const [heroCover, setHeroCover] = useState(DATA.heroCover || "");
  const coverInputRef = React.useRef(null);
  const onPickCover = e => {
    const f = e.target.files && e.target.files[0];

  // Auto-extract colors for "auto" slots on mount

    if (!ok) return;
    heroSlots.forEach((slot, i) => {
      if (slot.mode !== "auto") return;
      extractDominantColor(slot.src, (rgb) => {
        const th = colorToTheme(rgb);
        setHeroSlots(prev => prev.map((s,j) => j===i && s.mode==="auto" ? {...s, color: th.accent} : s));
      });
    });
  }, [ok]);

  const setSlotMode = (i, mode) => {
    setHeroSlots(prev => prev.map((s,j) => j!==i ? s : {...s, mode}));
    if (mode === "auto") {
      extractDominantColor(heroSlots[i].src, (rgb) => {
        const th = colorToTheme(rgb);
        setHeroSlots(prev => prev.map((s,j) => j===i ? {...s, color: th.accent, mode:"auto"} : s));

          <p style={{margin:"0 0 16px",fontSize:"var(--text-sm)",color:"var(--text-muted)"}}>
            Each image has an accent color used for the background gradient. Default is auto-extracted via canvas — override with the picker if needed. On save, the color is stored to DB; the client reads it directly with no processing.
          </p>
          {/* Cover image (optional) — full-bleed backdrop behind the gradient */}
          <div style={{display:"flex",alignItems:"center",gap:14,padding:"12px 14px",borderRadius:"var(--radius-sm)",border:"1px solid var(--border-default)",background:"var(--bg-sunken)",marginBottom:16}}>
            <div style={{width:88,height:52,borderRadius:"var(--radius-sm)",overflow:"hidden",flexShrink:0,border:"1px dashed var(--border-strong)",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg-page)"}}>
              {heroCover
                ? <img src={heroCover} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                : <span style={{fontSize:"var(--text-xs)",color:"var(--text-muted)"}}>Không có</span>}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:"var(--text-sm)",fontWeight:600,color:"var(--text-strong)"}}>Ảnh bìa (tùy chọn)</div>
              <div style={{fontSize:"var(--text-xs)",color:"var(--text-muted)",marginTop:2}}>
                Ảnh nền full-bleed nằm dưới dải gradient. Để trống nếu không muốn dùng.

            </div>
            <input ref={coverInputRef} type="file" accept="image/*" onChange={onPickCover} style={{display:"none"}}/>
            <button onClick={()=>coverInputRef.current&&coverInputRef.current.click()}

                      {m==="auto" ? "Auto" : "Manual"}

                  ))}
                </div>
                {/* Color preview + picker (manual) or read-only (auto) */}
                <label style={{display:"flex",alignItems:"center",gap:8,flexShrink:0,cursor: slot.mode==="manual" ? "pointer" : "default"}}>
                  <span style={{position:"relative",width:34,height:34,borderRadius:"var(--radius-sm)",overflow:"hidden",border:"2px solid var(--border-strong)",display:"block",flexShrink:0}}>
                    <span style={{position:"absolute",inset:0,background: slot.color || "#444",pointerEvents:"none"}}/>
                    {slot.mode==="manual" && (
                      <input type="color" value={slot.color||"#3b1278"}
                        onChange={e=>setHeroSlots(prev=>prev.map((s,j)=>j===i?{...s,color:e.target.value}:s))}

        </form>

    </div>

}

            }}
              onMouseEnter={e=>{e.currentTarget.style.color="var(--text-link)";e.currentTarget.style.borderColor="var(--border-brand)"}}
              onMouseLeave={e=>{e.currentTarget.style.color="var(--text-body)";e.currentTarget.style.borderColor="var(--border-default)"}}>
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        )}
      </div>
      {lightbox && <Lightbox photos={lightbox.photos} startIdx={lightbox.idx} onClose={()=>setLightbox(null)} />}
      {eventPopup && <EventPopup event={eventPopup.event} onClose={closeEventPopup} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<style>
  @keyframes hero-fade-in  { from{opacity:0} to{opacity:1} }
  @keyframes hero-fade-out { from{opacity:1} to{opacity:0} }
</style>
</body>
</html>
