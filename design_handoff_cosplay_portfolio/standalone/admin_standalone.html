  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4d1f7361-f946-4407-a6b0-b05b2e22b844\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<!-- @template name=\"Cosplay Admin\" description=\"Full admin console matching the cosplay portfolio: login, album manager (drag-reorder + drag-drop upload), bilingual site settings, hero accent slots, events popup, supports, and live color-scheme picker — dark neon-pink\" -->\n<helmet>\n<script src=\"12fe79ff-4b70-4bc2-b8f4-d25817272219\"><\u002Fscript>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; }\n  input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }\n  select option { background: var(--bg-elevated); color: var(--text-strong); }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"dark\" ref=\"{{ rootRef }}\" style=\"min-height: 100vh; background: var(--bg-page); font-family: var(--font-sans); color: var(--text-strong);\">\n\n  <!-- ============ LOGIN ============ -->\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;\">\n      <div style=\"width: 100%; max-width: 380px; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-pink-soft); padding: 32px;\">\n        <h2 style=\"margin: 0 0 4px; font-size: var(--text-xl); font-weight: 700; color: var(--text-strong);\">Đăng nhập Admin<\u002Fh2>\n        <p style=\"margin: 0 0 22px; font-size: var(--text-sm); color: var(--text-muted);\">Cosplay Portfolio · trang quản trị<\u002Fp>\n        <div style=\"margin-bottom: 16px;\">\n          <label style=\"display: block; font-size: var(--text-sm); font-weight: 500; color: var(--text-body); margin-bottom: 6px;\">Tên đăng nhập<\u002Flabel>\n          <input type=\"text\" value=\"{{ username }}\" on n    <header style=\"background: var(--surface-card); border-bottom: 1px solid var(--border-default); padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20;\">\n      <h1 style=\"margin: 0; font-size: var(--text-lg); font-weight: 700; color: var(--text-strong);\">Admin — Cosplay Portfolio<\u002Fh1>\n      <div style=\"display: flex; gap: 16px; align-items: center;\">\n        <button onclick=\"{{ goAlbums }}\" data-tab=\"albums\" style=\"font-size: var(--text-sm); border: none; background: transparent; cursor: pointer; font-family: var(--font-sans); padding: 4px 0; color: var(--text-muted);\">Albums<\u002Fbutton>\n        <button onclick=\"{{ goSettings }}\" data-tab=\"settings\" style=\"font-size: var(--text-sm); border: none; background: transparent; cursor: pointer; font-family: var(--font-sans); padding: 4px 0; color: var(--text-muted);\">Cài đặt trang<\u002Fbutton>\n        <button onclick=\"{{ logout }}\" style=\"font-size: var(--text-sm); border: none; background: transparent; color: var(--text-body); cursor: pointer; font-family: var(--font-sans);\" style-hover=\"color: var(--text-link);\">Đăng xuất<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- ---- ALBUMS TAB ---- -->\n    <sc-if value=\"{{ isAlbumsTab }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"max-width: 56rem; margin: 0 auto; padding: 32px 24px;\">\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px;\">\n          <h2 style=\"margin: 0; font-size: var(--text-xl); font-weight: 700; color: var(--text-strong);\">Quản lý Albums<\u002Fh2>\n          <x-import component-from-global-scope=\"CosplayPortfolioDesignSystem_f9b132.Button\" variant=\"primary\" size=\"sm\" onclick=\"{{ openAddForm }}\" hint-size=\"130px,38px\">+ Thêm album<\u002Fx-import>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom: 22px; padding: 18px; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg);\">\n            <h3 style=\"margin: 0 0 14px; font-weight: 700; color: var(--text-strong);\">{{ formHeading }}<\u002Fh3>\n            <label style=\"display: block; font-size: var(--text-sm); font-weight: 500; color: var(--text-body); margin-bottom: 6px;\">Tên album<\u002Flabel>\n            <input type=\"text\" value=\"{{ ftitle }}\" onchange=\"{{ onFTitle }}\" placeholder=\"VD: Genshin — Keqing\" style=\"width: 100%; box-sizing: border-box; padding: 9px 11px; font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-strong); background: var(--bg-sunken); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); outline: none; margin-bottom: 14px;\" style-focus=\"border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft);\">\n            <label style=\"display: block; font-size: var(--text-sm); font-weight: 500; color: var(--text-body); margin-bottom: 6px;\">Mô tả (tùy chọn)<\u002Flabel>\n            <textarea value=\"{{ fdesc }}\" onchange=\"{{ onFDesc }}\" rows=\"2\" placeholder=\"Mô tả ngắn...\" style=\"width: 100%; box-sizing: border-box; padding: 9px 11px; font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-strong); background: var(--bg-sunken); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); outline: none; resize: vertical; margin-bottom: 14px;\" style-focus=\"border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft);\"><\u002Ftextarea>\n            <div style=\"display: flex; gap: 10px;\">\n              <x-import component-from-global-scope=\"CosplayPortfolioDesignSystem_f9b132.Button\" variant=\"primary\" size=\"sm\" onclick=\"{{ saveForm }}\" hint-size=\"70px,38px\">Lưu<\u002Fx-import>\n              <button onclick=\"{{ cancelForm }}\" style=\"padding: 8px 16px; font-size: var(--text-sm); border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: transparent; color: var(--text-body); cursor: pointer; font-family: var(--font-sans);\" style-hover=\"background: var(--bg-hover);\">Hủy<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <p style=\"font-size: var(--text-sm); color: var(--text-muted); margin: 0 0 10px;\">Kéo thả album để đổi thứ tự.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px;\">\n          <sc-for list=\"{{ albums }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <div data-arow=\"{{ a.id }}\" style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 12px 14px; transition: border-color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);\" ondragover=\"{{ a.onDragOver }}\" ondrop=\"{{ a.onDrop }}\" ondragenter=\"{{ a.onDragEnter }}\" ondragleave=\"{{ a.onDragLeave }}\">\n              <div draggable=\"{{ true }}\" ondragstart=\"{{ a.onDragStart }}\" ondragend=\"{{ a.onDragEnd }}\" title=\"Kéo để đổi thứ tự\" style=\"display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; cursor: grab;\">\n                <span aria-hidden=\"true\" style=\"flex-shrink: 0; color: var(--text-muted); user-select: none; letter-spacing: -2px;\">⋮⋮<\u002Fspan>\n                <img src=\"{{ a.cover }}\" alt=\"\" style=\"width: 44px; height: 44px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0; border: 1px solid var(--border-default);\">\n                <div style=\"min-width: 0; flex: 1;\">\n                  <h3 style=\"margin: 0; font-weight: 500; font-size: var(--text-base); color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ a.title }}<\u002Fh3>\n                  <sc-if value=\"{{ a.hasDesc }}\" hint-placeholder-val=\"{{ false }}\">\n                    <p style=\"margin: 2px 0 0; font-size: var(--text-sm); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ a.description }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <p style=\"margin: 3px 0 0; font-size: var(--text-xs); color: var(--text-faint);\">{{ a.countLabel }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0;\">\n                <button onclick=\"{{ a.toggleManage }}\" data-amanage=\"{{ a.id }}\" style=\"padding: 5px 12px; font-size: var(--text-sm); border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-sans); border: 1px solid var(--border-strong); background: transparent; color: var(--text-body);\">{{ a.manageLabel }}<\u002Fbutton>\n                <button onclick=\"{{ a.edit }}\" style=\"padding: 5px 12px; font-size: var(--text-sm); border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: transparent; color: var(--text-body); cursor: pointer; font-family: var(--font-sans);\" style-hover=\"color: var(--text-link); border-color: var(--border-brand);\">Sửa<\u002Fbutton>\n                <button onclick=\"{{ a.del }}\" style=\"padding: 5px 12px; font-size: var(--text-sm); border-radius: var(--radius-sm); border: 1px solid rgba(239,68,68,.5); background: transparent; color: var(--text-error); cursor: pointer; font-family: var(--font-sans);\" style-hover=\"background: rgba(239,68,68,.1);\">Xóa<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- Manage images panel -->\n        <sc-if value=\"{{ selectedAlbum }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 24px;\">\n            <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px;\">\n              <h3 style=\"margin: 0; font-weight: 700; font-size: var(--text-lg); color: var(--text-strong);\">Ảnh trong: {{ selectedAlbum.title }}<\u002Fh3>\n              <button onclick=\"{{ selectedAlbum.close }}\" style=\"font-size: var(--text-sm); border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-family: var(--font-sans);\" style-hover=\"color: var(--text-link);\">✕ Đóng<\u002Fbutton>\n            <\u002Fdiv>\n            <div onclick=\"{{ selectedAlbum.pick }}\" ondrop=\"{{ selectedAlbum.drop }}\" ondragover=\"{{ onDragOverZone }}\" style=\"border: 2px dashed var(--border-strong); border-radius: var(--radius-lg); padding: 28px; text-align: center; cursor: pointer; color: var(--text-muted); font-size: var(--text-sm); margin-bottom: 20px;\" style-hover=\"border-color: var(--border-brand); background: var(--brand-soft);\">\n              <p style=\"margin: 0;\">Kéo thả ảnh vào đây hoặc click để chọn<\u002Fp>\n            <\u002Fdiv>\n            <sc-if value=\"{{ uploadError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin: -8px 0 16px; font-size: var(--text-sm); color: var(--text-error);\">{{ uploadError }}<\u002Fp>\n            <\u002Fsc-if>\n            <p style=\"font-size: var(--text-sm); color: var(--text-muted); margin: 0 0 10px;\">Kéo thả ảnh để đổi thứ tự.<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px;\">\n              <sc-for list=\"{{ selectedAlbum.images }}\" as=\"img\" hint-placeholder-count=\"6\">\n                <div draggable=\"{{ true }}\" ondragstart=\"{{ img.onDragStart }}\" ondragend=\"{{ img.onDragEnd }}\" ondragover=\"{{ onDragOverZone }}\" ondrop=\"{{ img.onDrop }}\" data-aimg=\"{{ img.id }}\" style=\"position: relative; border-radius: var(--radius-lg); cursor: grab; transition: opacity var(--dur-fast), box-shadow var(--dur-fast);\">\n                  <img src=\"{{ img.src }}\" alt=\"\" style=\"width: 100%; height: 128px; object-fit: cover; border-radius: var(--radius-lg); display: block; pointer-events: none;\">\n                  <button onclick=\"{{ img.remove }}\" title=\"Xóa ảnh\" style=\"position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: none; border-radius: 9999px; background: var(--red-500); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ selectedAlbum.empty }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size: var(--text-sm); color: var(--text-faint); margin: 4px 0 0;\">Chưa có ảnh nào. Thêm ảnh phía trên.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ---- SETTINGS TAB ---- -->\n    <sc-if value=\"{{ isSettingsTab }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width: 46rem; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center;\">\n          <h2 style=\"margin: 0; font-size: var(--text-xl); font-weight: 700; color: var(--text-strong);\">Cài đặt trang<\u002Fh2>\n          <x-import component-from-global-scope=\"CosplayPortfolioDesignSystem_f9b132.Button\" variant=\"primary\" size=\"sm\" onclick=\"{{ saveSettings }}\" hint-size=\"70px,38px\">Lưu<\u002Fx-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ saveMsg }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin: 0; font-size: var(--text-sm); color: #4ade80;\">{{ saveMsg }}<\u002Fp>\n        <\u002Fsc-if>\n\n        <!-- Color scheme -->\n        <div style=\"background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 18px;\">\n          <h3 style=\"margin: 0 0 4px; font-weight: 600; color: var(--text-strong); font-size: var(--text-base);\">Bảng màu (Color Scheme)<\u002Fh3>\n          <p style=\"margin: 0 0 14px; font-size: var(--text-sm); color: var(--text-muted);\">Chọn tông màu — khách xem trang sẽ thấy màu này. Áp dụng trực tiếp bên dưới.<\u002Fp>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n            <sc-for list=\"{{ schemes }}\" as=\"sc\" hint-placeholder-count=\"5\">\n              <button onclick=\"{{ sc.pick }}\" data-scheme=\"{{ sc.key }}\" style=\"display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all .2s; font-family: var(--font-sans); background: transparent; border: 2px solid var(--border-default);\">\n                <span data-scheme-dot=\"{{ sc.key }}\" style=\"width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; background: var(--brand);\"><\u002Fspan>\n                <span data-scheme-label=\"{{ sc.key }}\" style=\"font-size: var(--text-sm); font-weight: 600; color: var(--text-body);\">{{ sc.name }}<\u002Fspan>\n                <sc-if value=\"{{ sc.active }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 10px; color: var(--brand);\">✓<\u002Fspan><\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Main info -->\n        <div style=\"background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 16px;\">\n          <h3 style=\"margin: 0; font-weight: 600; color: var(--text-strong); font-size: var(--text-base);\">Thông tin chính (vi / en)<\u002Fh3>\n          <div>\n            < div>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button onclick=\"{{ addContact }}\" style=\"margin-top: 8px; font-size: var(--text-sm); border: none; background: transparent; color: var(--text-link); cursor: pointer; font-family: var(--font-sans);\">+ Thêm liên hệ<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Social -->\n        <div style=\"background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px;\">\n          <h3 style=\"margin: 0; font-weight: 600; color: var(--text-strong); font-size: var(--text-base);\">Social links<\u002Fh3>\n          <p style=\"margin: 0; font-size: var(--text-xs); color: var(--text-faint);\">Danh sách nền tảng cố định — chỉ điền URL. Để trống để ẩn nút đó.<\u002Fp>\n          <sc-for list=\"{{ social }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <label style=\"width: 90px; font-size: var(--text-sm); color: var(--text-body); flex-shrink: 0;\">{{ s.label }}<\u002Flabel>\n              <input type=\"url\" value=\"{{ s.url }}\" onchange=\"{{ s.onUrl }}\" placeholder=\"https://...\" style=\"flex: 1; min-width: 0; box-sizing: border-box; padding: 8px 10px; font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-strong); background: var(--bg-sunken); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); outline: none;\" style-focus=\"border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft);\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- Supports -->\n        <div style=\"background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px;\">\n          <h3 style=\"margin: 0; font-weight: 600; color: var(--text-strong); font-size: var(--text-base);\">Supports (Gumroad · Gank · PayPal)<\u002Fh3>\n          <p style=\"margin: 0; font-size: var(--text-xs); color: var(--text-faint);\">Điền URL cho từng kênh. Để trống để ẩn.<\u002Fp>\n          <sc-for list=\"{{ supports }}\" as=\"sp\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <label style=\"width: 90px; font-size: var(--text-sm); color: var(--text-body);\">{{ sp.label }}<\u002Flabel>\n              <input type=\"url\" value=\"{{ sp.value }}\" onchange=\"{{ sp.onChange }}\" placeholder=\"{{ sp.placeholder }}\" style=\"flex: 1; min-width: 0; box-sizing: border-box; padding: 8px 10px; font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-strong); background: var(--bg-sunken); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); outline: none;\" style-focus=\"border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft);\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"height: 8px;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <input type=\"file\" multiple=\"{{ true }}\" accept=\"image/*\" ref=\"{{ fileRef }}\" onchange=\"{{ onFilesPicked }}\" style=\"display: none;\">\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 820}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const P = (n) => \"../../assets/placeholders/cos-\" + n + \".jpg\";\n    this._seq = 1000;\n    const mk = (nums) => nums.map((n) => ({ id: ++this._seq, src: P(n) }));\n    this.fileRef = React.createRef();\n    this.rootRef = React.createRef();\n    this.uploadTarget = null;\n    this.SCHEMES = {\n      pink:   { name: \"Pink\",   brand: \"#ec4899\", hover: \"#f472b6\", strong: \"#db2777\", glow: \"rgba(236,72,153,.30)\", soft: \"rgba(236,72,153,.15)\", grad1: \"#f472b6\", grad2: \"#fb7185\" },\n      blue:   { name: \"Blue\",   brand: \"#3b82f6\", hover: \"#60a5fa\", strong: \"#2563eb\", glow: \"rgba(59,130,246,.30)\",  soft: \"rgba(59,130,246,.15)\",  grad1: \"#60a5fa\", grad2: \"#818cf8\" },\n      purple: { name: \"Purple\", brand: \"#8b5cf6\", hover: \"#a78bfa\", strong: \"#7c3aed\", glow: \"rgba(139,92,246,.30)\", soft: \"rgba(139,92,246,.15)\", grad1: \"#a78bfa\", grad2: \"#c084fc\" },\n      amber:  { name: \"Amber\",  brand: \"#f59e0b\", hover: \"#fbbf24\", strong: \"#d97706\", glow: \"rgba(245,158,11,.30)\",  soft: \"rgba(245,158,11,.15)\",  grad1: \"#fbbf24\", grad2: \"#fb923c\" },\n      rose:   { name: \"Rose\",   brand: \"#f43f5e\", hover: \"#fb7185\", strong: \"#e11d48\", glow: \"rgba(244,63,94,.30)\",   soft: \"rgba(244,63,94,.15)\",   grad1: \"#fb7185\", grad2: \"#fda4af\" },\n    };\n    this.state = {\n      authed: false,\n      username: \"\",\n      password: \"\",\n      loginError: \"\",\n      tab: \"albums\",\n      scheme: \"pink\",\n      albums: [\n        { id: 1, title: \"Genshin — Raiden Shogun\", description: \"Studio + convention set\", images: mk([1, 2, 3, 4, 5, 6]) },\n        { id: 2, title: \"Honkai — Firefly\", description: \"\", images: mk([7, 8, 9, 10]) },\n        { id: 3, title: \"Convention diary\", description: \"AniMate & Comic Con 2025\", images: mk([11, 12, 1, 7, 3, 9]) },\n      ],\n      nextAlbumId: 4,\n      selectedId: null,\n      showAddForm: false,\n      editingId: null,\n      ftitle: \"\",\n      fdesc: \"\",\n      dragAlbum: null,\n      overAlbum: null,\n      dragImg: null,\n      overImg: null,\n      uploadError: \"\",\n      dragEvent: null,\n      overEvent: null,\n      saveMsg: \"\",\n      heroSlots: [\n        { src: \"../../assets/placeholders/cos-2.jpg\", color: \"#7a2a52\", mode: \"auto\" },\n        { src: \"../../assets/placeholders/cos-5.jpg\", color: \"#3b2a78\", mode: \"auto\" },\n      ],\n      settings: {\n        artistName: { vi: \"Kamidayhehe\", en: \"Kamidayhehe\" },\n        tagline: { vi: \"Cosplayer • Prop Maker • Bạn của nhiếp ảnh\", en: \"Cosplayer • Prop Maker • Photographer Friend\" },\n        about: {\n          vi: \"Chào! Mình chủ yếu cosplay mảng anime và game, tự làm trang phục và đạo cụ, và có kinh nghiệm chụp tại sự kiện. Nhận booking cho convention, photoshoot và collab.\",\n          en: \"Hi! I do cosplay mostly in anime and game genres, make my own costumes and props, and shoot at events. Booking open for conventions, photoshoots and collabs.\",\n        },\n        heroImages: [\"../../assets/placeholders/cos-2.jpg\", \"../../assets/placeholders/cos-5.jpg\"],\n        heroCover: \"\",\n        logoUrl: \"\",\n        upcomingEvents: [\n          { title: { vi: \"Comic Con Vietnam 2026\", en: \"Comic Con Vietnam 2026\" }, date: \"15/08\", url: \"\", showPopup: true, imageUrl: \"../../assets/placeholders/cos-2.jpg\" },\n          { title: { vi: \"AniMate Festival — khách mời\", en: \"AniMate Festival — guest\" }, date: \"02/09\", url: \"\", showPopup: false },\n        ],\n        contact: {\n          phone: \"0901234567\",\n          email: \"hello@kamidayhehe.vn\",\n          contactLinks: [{ type: \"zalo\", value: \"0901234567\" }],\n          social: [\n            { platform: \"facebook\", label: \"Facebook\", url: \"https://facebook.com/kamimoe1911\" },\n            { platform: \"instagram\", label: \"Instagram\", url: \"https://instagram.com/kamidayhehe\" },\n            { platform: \"page\", label: \"Page\", url: \"https://facebook.com/kamimoe1911\" },\n            { platform: \"x\", label: \"X\", url: \"https://x.com/Kamidayhehe\" },\n            { platform: \"tiktok\", label: \"TikTok\", url: \"https://tiktok.com/@kamidayhehe\" },\n            { platform: \"discord\", label: \"Discord\", url: \"https://discord.gg/kamidayhehe\" },\n          ],\n          supports: { gumroad: \"\", gank: \"\", paypal: \"\" },\n        },\n      },\n    };\n  }\n\n  nextId() { return ++this._seq; }\n  prevent(e) { e.preventDefault(); e.stopPropagation(); }\n\n  /* ---- auth / nav ---- */\n  login() {\n    if (this.state.username.trim() && this.state.password.trim()) this.setState({ authed: true, loginError: \"\" });\n    else this.setState({ loginError: \"Vui lòng nhập tên đăng nhập và mật khẩu.\" });\n  }\n  logout() { this.setState({ authed: false, password: \"\", tab: \"albums\", selectedId: null, showAddForm: false, editingId: null }); }\n\n  /* ---- album CRUD ---- */\n  openAddForm() { this.setState({ showAddForm: true, editingId: null, ftitle: \"\", fdesc: \"\" }); }\n  editAlbum(a) { this.setState({ editingId: a.id, showAddForm: false, ftitle: a.title, fdesc: a.description || \"\" }); }\n  cancelForm() { this.setState({ showAddForm: false, editingId: null, ftitle: \"\", fdesc: \"\" }); }\n  saveForm() {\n    const title = this.state.ftitle.trim();\n    if (!title) return;\n    const desc = this.state.fdesc.trim();\n    this.setState((s) => {\n      if (s.editingId != null) return { albums: s.albums.map((a) => (a.id === s.editingId ? { ...a, title, description: desc } : a)), editingId: null, ftitle: \"\", fdesc: \"\" };\n      const id = s.nextAlbumId;\n      return { albums: [...s.albums, { id, title, description: desc, images: [] }], nextAlbumId: id + 1, showAddForm: false, ftitle: \"\", fdesc: \"\" };\n    });\n  }\n  deleteAlbum(id) {\n    if (!confirm(\"Xóa album và tất cả ảnh trong album?\")) return;\n    this.setState((s) => ({ albums: s.albums.filter((a) => a.id !== id), selectedId: s.selectedId === id ? null : s.selectedId }));\n  }\n  toggleManage(id) { this.setState((s) => ({ selectedId: s.selectedId === id ? null : id, uploadError: \"\" })); }\n  reorderAlbums(fromId, toId) {\n    if (fromId == null || fromId === toId) return;\n    this.setState((s) => {\n      const arr = [...s.albums];\n      const fi = arr.findIndex((a) => a.id === fromId), ti = arr.findIndex((a) => a.id === toId);\n      if (fi === -1 || ti === -1) return {};\n      const [m] = arr.splice(fi, 1); arr.splice(ti, 0, m);\n      return { albums: arr, dragAlbum: null, overAlbum: null };\n    });\n  }\n\n  /* ---- images ---- */\n  deleteImage(albumId, imgId) {\n    if (!confirm(\"Xóa ảnh này?\")) return;\n    this.setState((s) => ({ albums: s.albums.map((a) => (a.id === albumId ? { ...a, images: a.images.filter((i) => i.id !== imgId) } : a)) }));\n  }\n  reorderImages(albumId, fromId, toId) {\n    if (fromId == null || fromId === toId) return;\n    this.setState((s) => ({\n      albums: s.albums.map((a) => {\n        if (a.id !== albumId) return a;\n        const arr = [...a.images];\n        const fi = arr.findIndex((i) => i.id === fromId), ti = arr.findIndex((i) => i.id === toId);\n        if (fi === -1 || ti === -1) return a;\n        const [m] = arr.splice(fi, 1); arr.splice(ti, 0, m);\n        return { ...a, images: arr };\n      }),\n      dragImg: null, overImg: null,\n    }));\n  }\n\n  /* ---- file upload ---- */\n  openPicker(target) {\n    this.uploadTarget = target;\n    if (this.fileRef.current) { this.fileRef.current.value = \"\"; this.fileRef.current.click(); }\n  }\n  onFilesPicked(e) { if (this.uploadTarget) this.routeFiles(this.uploadTarget, e.target.files); }\n  routeFiles(target, fileList) {\n    const files = Array.from(fileList || []).filter((f) => f.type && f.type.indexOf(\"image/\") === 0);\n    if (!files.length) { this.setState({ uploadError: \"Vui lòng chọn tệp ảnh.\" }); return; }\n    this.setState({ uploadError: \"\" });\n    files.forEach((f) => { const r = new FileReader(); r.onload = () => this.applyUpload(target, r.result); r.readAsDataURL(f); });\n  }\n  applyUpload(target, url) {\n    if (target.kind === \"albumImages\") {\n      this.setState((s) => ({ albums: s.albums.map((a) => (a.id === target.albumId ? { ...a, images: [...a.images, { id: this.nextId(), src: url }] } : a)) }));\n    } else if (target.kind === \"eventImage\") {\n      this.updateEvent(target.idx, \"imageUrl\", url);\n    } else if (target.kind === \"cover\") {\n      this.setIn(\"heroCover\", url);\n    } else if (target.kind === \"logo\") {\n      this.setIn(\"logoUrl\", url);\n    } else if (target.kind === \"heroImages\") {\n      this.setState((s) => {\n        const cfg = JSON.parse(JSON.stringify(s.settings));\n        cfg.heroImages = [...(cfg.heroImages || []), url];\n        return { settings: cfg, heroSlots: [...s.heroSlots, { src: url, color: \"#3b1278\", mode: \"auto\" }], saveMsg: \"\" };\n      });\n    }\n  }\n\n  /* ---- hero slots ---- */\n  setSlotMode(i, mode) { this.setState((s) => ({ heroSlots: s.heroSlots.map((sl, j) => (j === i ? { ...sl, mode } : sl)), saveMsg: \"\" })); }\n  removeHeroImage(i) {\n    this.setState((s) => {\n      const cfg = JSON.parse(JSON.stringify(s.settings));\n      cfg.heroImages = cfg.heroImages.filter((_, j) => j !== i);\n      return { settings: cfg, heroSlots: s.heroSlots.filter((_, j) => j !== i), saveMsg: \"\" };\n    });\n  }\n\n  /* ---- settings helpers ---- */\n  setIn(path, value) {\n    this.setState((s) => {\n      const cfg = JSON.parse(JSON.stringify(s.settings));\n      const parts = path.split(\".\"); let t = cfg;\n      for (let i = 0; i < parts.length - 1; i++) { if (t[parts[i]] == null) t[parts[i]] = {}; t = t[parts[i]]; }\n      t[parts[parts.length - 1]] = value;\n      return { settings: cfg, saveMsg: \"\" };\n    });\n  }\n  getArr(cfg, path) { return path.split(\".\").reduce((o, k) => o[k], cfg); }\n  addArrItem(path, item) { this.setState((s) => { const cfg = JSON.parse(JSON.stringify(s.settings)); this.getArr(cfg, path).push(item); return { settings: cfg, saveMsg: \"\" }; }); }\n  removeArrItem(path, idx) { this.setState((s) => { const cfg = JSON.parse(JSON.stringify(s.settings)); this.getArr(cfg, path).splice(idx, 1); return { settings: cfg, saveMsg: \"\" }; }); }\n  updateArrItem(path, idx, field, value) { this.setState((s) => { const cfg = JSON.parse(JSON.stringify(s.settings)); const arr = this.getArr(cfg, path); arr[idx] = { ...arr[idx], [field]: value }; return { settings: cfg, saveMsg: \"\" }; }); }\n  updateEvent(idx, field, value) {\n    this.setState((s) => {\n      const cfg = JSON.parse(JSON.stringify(s.settings));\n      const ev = cfg.upcomingEvents[idx];\n      if (field.indexOf(\".\") > -1) { const [a, b] = field.split(\".\"); ev[a] = ev[a] || {}; ev[a][b] = value; } else ev[field] = value;\n      return { settings: cfg, saveMsg: \"\" };\n    });\n  }\n  setEventPopup(idx, checked) {\n    this.setState((s) => {\n      const cfg = JSON.parse(JSON.stringify(s.settings));\n      cfg.upcomingEvents = cfg.upcomingEvents.map((e, j) => ({ ...e, showPopup: j === idx ? checked : false }));\n      return { settings: cfg, saveMsg: \"\" };\n    });\n  }\n  reorderEvents(fromIdx, toIdx) {\n    if (fromIdx == null || fromIdx === toIdx) return;\n    this.setState((s) => {\n      const cfg = JSON.parse(JSON.stringify(s.settings));\n      const arr = cfg.upcomingEvents;\n      if (fromIdx < 0 || toIdx < 0 || fromIdx >= arr.length || toIdx >= arr.length) return {};\n      const [m] = arr.splice(fromIdx, 1); arr.splice(toIdx, 0, m);\n      return { settings: cfg, dragEvent: null, overEvent: null, saveMsg: \"\" };\n    });\n  }\n  saveSettings() { this.setState({ saveMsg: \"✓ Đã lưu! Khách sẽ thấy thay đổi ở lần truy cập tiếp theo.\" }); }\n\n  applyScheme() {\n    const el = this.rootRef && this.rootRef.current;\n    if (!el) return;\n    const sc = this.SCHEMES[this.state.scheme] || this.SCHEMES.pink;\n    el.style.setProperty(\"--brand\", sc.brand);\n    el.style.setProperty(\"--brand-hover\", sc.hover);\n    el.style.setProperty(\"--brand-strong\", sc.strong);\n    el.style.setProperty(\"--brand-soft\", sc.soft);\n    el.style.setProperty(\"--border-brand\", sc.brand);\n    el.style.setProperty(\"--text-link\", sc.hover);\n    el.style.setProperty(\"--shadow-pink-glow\", \"0 0 40px \" + sc.glow);\n    el.style.setProperty(\"--shadow-pink-soft\", \"0 8px 32px \" + sc.soft);\n  }\n  applyDynamicStyles() {\n    const el = this.rootRef && this.rootRef.current;\n    if (!el) return;\n    const s = this.state;\n    // tabs\n    el.querySelectorAll(\"[data-tab]\").forEach((b) => {\n      const active = b.getAttribute(\"data-tab\") === s.tab;\n      b.style.color = active ? \"var(--text-link)\" : \"var(--text-muted)\";\n      b.style.fontWeight = active ? \"600\" : \"\";\n    });\n    // album rows (drag)\n    el.querySelectorAll(\"[data-arow]\").forEach((r) => {\n      const id = +r.getAttribute(\"data-arow\");\n      const over = s.overAlbum === id && s.dragAlbum != null && s.dragAlbum !== id;\n      r.style.borderColor = over ? \"var(--brand)\" : \"var(--border-default)\";\n      r.style.opacity = s.dragAlbum === id ? \"0.5\" : \"\";\n    });\n    // manage buttons (active)\n    el.querySelectorAll(\"[data-amanage]\").forEach((b) => {\n      const active = +b.getAttribute(\"data-amanage\") === s.selectedId;\n      b.style.border = active ? \"1px solid var(--border-brand)\" : \"1px solid var(--border-strong)\";\n      b.style.background = active ? \"var(--brand-soft)\" : \"transparent\";\n      b.style.color = active ? \"var(--text-link)\" : \"var(--text-body)\";\n    });\n    // album images (drag)\n    el.querySelectorAll(\"[data-aimg]\").forEach((d) => {\n      const id = +d.getAttribute(\"data-aimg\");\n      const over = s.overImg === id && s.dragImg != null && s.dragImg !== id;\n      d.style.boxShadow = over ? \"0 0 0 2px var(--brand)\" : \"\";\n      d.style.opacity = s.dragImg === id ? \"0.5\" : \"\";\n    });\n    // scheme buttons / dots / labels\n    el.querySelectorAll(\"[data-scheme]\").forEach((b) => {\n      const key = b.getAttribute(\"data-scheme\");\n      const k = this.SCHEMES[key]; const active = s.scheme === key;\n      b.style.background = active ? k.soft : \"transparent\";\n      b.style.border = \"2px solid \" + (active ? k.brand : \"var(--border-default)\");\n    });\n    el.querySelectorAll(\"[data-scheme-dot]\").forEach((d) => {\n      const k = this.SCHEMES[d.getAttribute(\"data-scheme-dot\")];\n      d.style.background = k.brand; d.style.boxShadow = \"0 0 8px \" + k.glow;\n    });\n    el.querySelectorAll(\"[data-scheme-label]\").forEach((l) => {\n      const key = l.getAttribute(\"data-scheme-label\");\n      l.style.color = s.scheme === key ? this.SCHEMES[key].brand : \"var(--text-body)\";\n    });\n    // hero seg buttons (auto/manual)\n    el.querySelectorAll(\"[data-hseg]\").forEach((b) => {\n      const i = +b.getAttribute(\"data-hseg\"); const seg = b.getAttribute(\"data-seg\");\n      const slot = s.heroSlots[i]; const on = slot && slot.mode === seg;\n      b.style.background = on ? \"var(--brand)\" : \"transparent\";\n      b.style.color = on ? \"#fff\" : \"var(--text-muted)\";\n    });\n    // hero swatch + gradient\n    el.querySelectorAll(\"[data-hswatch]\").forEach((d) => {\n      const slot = s.heroSlots[+d.getAttribute(\"data-hswatch\")];\n      d.style.background = (slot && slot.color) || \"#444\";\n    });\n    el.querySelectorAll(\"[data-hgrad]\").forEach((d) => {\n      const slot = s.heroSlots[+d.getAttribute(\"data-hgrad\")];\n      d.style.background = slot && slot.color ? \"linear-gradient(135deg,#080810,\" + slot.color + \",#05050a)\" : \"var(--bg-sunken)\";\n    });\n    // event rows (drag)\n    el.querySelectorAll(\"[data-erow]\").forEach((r) => {\n      const i = +r.getAttribute(\"data-erow\");\n      const over = s.overEvent === i && s.dragEvent != null && s.dragEvent !== i;\n      r.style.borderColor = over ? \"var(--brand)\" : \"var(--border-default)\";\n      r.style.opacity = s.dragEvent === i ? \"0.5\" : \"\";\n    });\n  }\n  componentDidMount() { this.applyScheme(); this.applyDynamicStyles(); }\n  componentDidUpdate(_, prev) { if (prev.scheme !== this.state.scheme) this.applyScheme(); this.applyDynamicStyles(); }\n\n  renderVals() {\n    const s = this.state;\n    con
