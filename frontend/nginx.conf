server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  client_max_body_size 500M;

  # Security headers (sent on every response; "always" covers error pages too).
  # Browsers ignore HSTS over plain HTTP, so it only takes effect once the
  # request came through the SSL-terminating host Nginx / Cloudflare.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP: no external scripts; inline styles allowed (React style props);
  # https: in img-src tolerates externally-hosted images pasted in admin.
  # connect-src is 'self' only: Goong address-autocomplete is proxied
  # through our own /api/shop/address-autocomplete (backend/routes/shop.js)
  # rather than fetched directly from the browser, so no external API
  # origin needs an allowance here - keeps the key server-side only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

  location /api {
    client_max_body_size 500M;
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
