services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-cosplay}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    logging: *logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    logging: *logging

  backend:
    image: phuc16/cosplay-backend:latest
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: ${DB_PASS:-root}
      DB_NAME: ${DB_NAME:-cosplay}
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cosplay}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SITE_URL: ${SITE_URL:-}
      SHOP_NAME: ${SHOP_NAME:-Shop}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
    logging: *logging

  worker:
    image: phuc16/cosplay-backend:latest
    build: ./backend
    restart: unless-stopped
    command: node worker.js
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: ${DB_PASS:-root}
      DB_NAME: ${DB_NAME:-cosplay}
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cosplay}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SITE_URL: ${SITE_URL:-}
      SHOP_NAME: ${SHOP_NAME:-Shop}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    logging: *logging

  frontend:
    image: phuc16/cosplay-frontend:latest
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    logging: *logging

volumes:
  mysql_data:
  minio_data:
